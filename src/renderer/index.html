<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Vườn Pixel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pos-bottom">
  <!-- Tab khi thu gọn -->
  <div id="tab" class="hidden" title="Mở vườn (Ctrl+Alt+G)">
    <canvas id="tab-icon"></canvas>
    <span class="tab-title">Vườn Pixel</span>
    <span id="tab-badges"></span>
  </div>

  <div id="app">
    <!-- Bảng mở rộng (cửa hàng, kho, sổ tay, nhật ký, cài đặt, chi tiết cây) -->
    <section id="panel" class="hidden">
      <header>
        <nav id="panel-tabs"></nav>
        <button class="icon-btn" id="panel-close" title="Đóng">✕</button>
      </header>
      <div id="panel-body"></div>
    </section>

    <!-- Thanh vườn -->
    <section id="bar">
      <div id="side">
        <button id="reset-shift" title="Bắt đầu tính thời gian vườn từ bây giờ (khi hôm nay bắt đầu sớm/muộn). Bấm 2 lần.">⟳</button>
        <button id="wheel-btn" title="Vòng quay may mắn">🎡</button>
        <button id="gift-btn" title="Quà hằng ngày">🎁</button>
        <button id="games-btn" title="Mini game: Bắt sâu, Ghép cặp hoa, Câu cá">🎮</button>
        <button id="bell" title="Việc cần làm">🔔</button>
        <button id="admin-btn" class="hidden" title="Admin – công cụ test">🛠</button>
        <button id="collapse" title="Thu gọn (Ctrl+Alt+G)">▾</button>
      </div>
      <div id="hud">
        <div class="row"><span id="lv">Cấp 1</span><span id="money">0 xu</span></div>
        <div class="expbar"><div id="exp-fill"></div><span id="exp-text"></span></div>
        <div id="clock"></div>
        <div id="tools"></div>
      </div>
      <div id="garden">
        <div id="sky"></div>
        <div id="scene-object" class="hidden" title="Trang trí cảnh vườn"></div>
        <div id="slots"></div>
        <div id="house" class="hidden"></div>
        <div id="pond" title="Ao vườn – bấm để câu cá"><i class="lily">🪷</i><i class="ripple"></i></div>
        <div id="pet" class="hidden"><div class="pet-say"></div><div class="pet-bubble"></div><canvas></canvas><div class="pet-fx"></div></div>
        <div id="ground"></div>
      </div>
      <div id="menu">
        <button data-panel="shop">🛒 Cửa hàng</button>
        <button data-panel="bag">🎒 Kho đồ</button>
        <button data-panel="wiki">📖 Sổ tay cây</button>
        <button data-panel="log">📜 Nhật ký</button>
        <button data-panel="settings">⚙ Cài đặt</button>
        <button data-panel="lan">🌐 Bạn bè & chat</button>
        <button id="music-btn" title="Bật/tắt nhạc nền">♪ Nhạc: tắt</button>
      </div>
    </section>
    <div id="toast"></div>
  </div>

  <script src="audio.js"></script>
  <script src="pack-fx.js"></script>
  <script src="sprites.js"></script>
  <script src="decor-sprites.js"></script>
  <script src="scene-sprites.js"></script>
  <script src="pet-talk.js"></script>
  <script src="arena.js"></script>
  <script src="minigames.js"></script>
  <script src="tree.js"></script>
  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
